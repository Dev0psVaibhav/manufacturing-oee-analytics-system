# ==============================================================================
# Production Environment Profile (prod)
# Hardened for enterprise deployments; credentials and sensitive variables
# MUST be injected via environment variables.
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: root
    password: Password@123
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.manufacturing.oee: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR
