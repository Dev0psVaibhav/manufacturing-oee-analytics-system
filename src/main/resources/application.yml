spring:
  application:
    name: manufacturing-oee-analytics
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database Connectivity Configuration (MySQL 8.x / InnoDB / utf8mb4)
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:manufacturing_oee}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: root
    password: Password@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ManufacturingOeeHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # Spring Data JPA / Hibernate Configuration
  jpa:
    open-in-view: false
    hibernate:
      # Validates entity mappings against manually managed MySQL schema.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
  shutdown: graceful

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

# Logging Level Configuration
logging:
  level:
    root: INFO
    com.manufacturing.oee: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
